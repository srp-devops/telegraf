name: Build Multi-Arch Docker Images

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for ARM emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for multi-architecture builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optional: Log in to a container registry (e.g., Docker Hub or GitHub Container Registry)
      # Uncomment and configure the secrets in your repository settings if you want to push the image
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the Docker image for both AMD64 and ARM64
      - name: Build and export
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          # By default, this will just build the images to verify they compile.
          # To push them to a registry, set push: true
          push: false
          tags: telegraf-custom:latest
          # Optional: cache layers in GitHub Actions to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
